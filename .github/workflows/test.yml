name: mh-bookmark-organizer tests

on:
  push:
    paths: [".claude/skills/mh-bookmark-organizer/**", ".claude/agents/mh-bookmark-organizer.md", ".claude-plugin/**", ".github/workflows/test.yml", ".github/workflows/release.yml"]
  pull_request:
    paths: [".claude/skills/mh-bookmark-organizer/**", ".claude/agents/mh-bookmark-organizer.md", ".claude-plugin/**", ".github/workflows/test.yml", ".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .claude/skills/mh-bookmark-organizer

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests tools
      - run: mypy

  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests (deprecations and leaked resources are errors)
        run: python -W error::DeprecationWarning -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Installs and runs as a console script
        run: |
          python -m pip install .
          mhbm --version
          mhbm doctor --json

  numpy:
    name: py${{ matrix.python }} with numpy (the optional speed-up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[fast]"
      - run: python -c "import mhbm.learn as l; assert l.numpy_active(), 'numpy should be in use'"
      - name: Whole suite with numpy and worker processes
        run: python -W error::DeprecationWarning -W error::ResourceWarning -m unittest discover -s tests -v
        env:
          MHBM_WORKERS: "2"

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: coverage run -m unittest discover -s tests
      - run: coverage combine -q
      - run: coverage report   # fails below fail_under in pyproject.toml

  package:
    name: sdist and wheel build, check and install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the build tools (exact versions, exact file hashes)
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation --outdir dist .
          for f in dist/*.tar.gz; do python tools/normalize_sdist.py "$f"; done
      - name: twine check (renders the README the way PyPI does), check-wheel-contents, pyproject schema
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
          validate-pyproject pyproject.toml
      - name: Packaging tests (file lists, metadata, reproducible build, version agreement)
        run: python -W error::DeprecationWarning -W error::ResourceWarning -m unittest discover -s tests -p "test_packaging.py" -v
      - name: Install the wheel into a clean environment and use it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/.claude/skills/mh-bookmark-organizer/tools/smoke_installed.py" \
            --fixture "$GITHUB_WORKSPACE/.claude/skills/mh-bookmark-organizer/tests/fixtures/messy-library.html" --skip-learn

  realbrowser:
    name: real Chromium (headless) write-back tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true   # never run on GitHub yet: make it required once it has been seen to pass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: .claude/skills/mh-bookmark-organizer/tests/realbrowser
      - run: npx playwright-core install --with-deps chromium
        working-directory: .claude/skills/mh-bookmark-organizer/tests/realbrowser
      - name: A browser must be found (otherwise the tests would all skip and look green)
        run: node tests/realbrowser/driver.js probe
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_realbrowser.py" -v

  realfirefox:
    name: real Firefox 157 (headless Gecko writes, mhbm reads)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true   # never run on GitHub yet: make it required once it has been seen to pass
    env:
      # conda-forge repack of Mozilla's official Linux build (distribution.ini: mozilla-official); found with tests/real_firefox/pin_firefox.py
      FIREFOX_PKG: firefox-157.0.1-hee9eb32_0.conda
      FIREFOX_SHA256: f1b53de244dc14b0a0d2d848aa41d7cf0edb95992cd477dccac40ff4d7127f35   # 107,857,602 bytes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Fetch the pinned Firefox, verify its sha256, unpack
        run: |
          python -m pip install zstandard==0.25.0     # only this helper needs it; mhbm stays standard-library only
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$FIREFOX_PKG" "https://conda.anaconda.org/conda-forge/linux-64/$FIREFOX_PKG"
          python -I tests/real_firefox/extract_conda.py "$RUNNER_TEMP/$FIREFOX_PKG" "$FIREFOX_SHA256" "$RUNNER_TEMP/firefox"
          MOZ_HEADLESS=1 "$RUNNER_TEMP/firefox/bin/FirefoxApp/firefox" --version
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/firefox/bin/FirefoxApp
      - name: Tests that drive the real browser (warnings and leaked resources are errors)
        run: python -W error::DeprecationWarning -W error::ResourceWarning -m unittest discover -s tests -p "test_real_firefox.py" -v
        env:
          MHBM_FIREFOX_DIR: ${{ runner.temp }}/firefox/bin/FirefoxApp
          LD_LIBRARY_PATH: ${{ runner.temp }}/firefox/bin/FirefoxApp
          MHBM_NO_NETNS: "1"   # hosted runners cannot `unshare -n` unprivileged; the profile prefs keep the browser off the network

  extension:
    name: extension unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: npm test
        working-directory: .claude/skills/mh-bookmark-organizer/extension

  accuracy:
    name: filing accuracy and scale (several splits, big libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p "test_fixture.py" -v
        env:
          MHBM_SLOW: "1"
      - name: Training time on big libraries
        run: python -m unittest discover -s tests -p "test_scale.py" -v
        env:
          MHBM_SLOW: "1"
